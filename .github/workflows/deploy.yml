name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build elife-terms-prototype
        working-directory: elife-terms-prototype
        run: |
          npm ci
          npm run build

      - name: Build keyword-filter-prototype
        working-directory: keyword-filter-prototype
        run: |
          npm ci
          npm run build

      - name: Build oxa-reader-prototype
        working-directory: oxa-reader-prototype
        run: |
          npm ci
          npm run build

      - name: Build elife-model-reviews
        working-directory: elife-model-reviews
        run: |
          npm ci
          npm run build

      - name: Build claims-extraction
        working-directory: claims-extraction
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r elife-terms-prototype/dist _site/elife-terms-prototype
          cp -r keyword-filter-prototype/dist _site/keyword-filter-prototype
          cp -r oxa-reader-prototype/dist _site/oxa-reader-prototype
          cp -r elife-model-reviews/dist _site/elife-model-reviews
          cp -r claims-extraction/dist _site/claims-extraction

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
